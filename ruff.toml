[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "B",   # bugbear (likely bugs and design problems)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize Python syntax)
    "N",   # pep8-naming
    "S",   # bandit security rules
    "TRY", # tryceratops (exception handling antipatterns)
]
ignore = [
    "S101",   # use of assert — OK in scrapers
    "TRY003", # long messages outside exception class — OK for scraper errors
    "B008",   # function calls in default args — common in scrapers
]

[tool.ruff.lint.per-file-ignores]
"**/scrapers/**" = ["S", "TRY"]  # security and exception rules relaxed in scraper files
"**/tests/**" = ["S101"]         # assert OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
