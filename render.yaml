# =============================================================================
# ShadowMerchant — Render Configuration
# =============================================================================
# NOTE: Scrapers do NOT run on Render.
# All scraping runs locally on a Windows machine via Windows Task Scheduler.
# Render is used ONLY for the Flask health-check endpoint so uptime monitors
# (e.g. UptimeRobot) can confirm the backend is responsive.
#
# To disable this service entirely, simply delete this file or pause the
# service in the Render dashboard. It will not affect scraping or the website.
# =============================================================================

services:
  - type: web
    name: shadowmerchant-healthcheck
    env: python
    buildCommand: pip install flask
    startCommand: python -c "from flask import Flask; app = Flask(__name__); app.route('/health')(lambda: ({'status':'ok'}, 200)); app.run(host='0.0.0.0', port=10000)"
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
