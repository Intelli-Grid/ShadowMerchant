name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web type-check

      - name: Lint
        run: pnpm --filter web lint

      - name: Build web app
        run: pnpm --filter web build
        env:
          # Use placeholder values — build must succeed without real secrets
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_ALGOLIA_APP_ID: placeholder
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: placeholder
          NEXT_PUBLIC_ALGOLIA_INDEX_NAME: placeholder
          NEXT_PUBLIC_APP_URL: https://shadowmerchant.online
          NEXT_PUBLIC_RAZORPAY_KEY_ID: placeholder
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
          NEXT_PUBLIC_ONESIGNAL_APP_ID: placeholder
          # Server-side vars needed at build time only (not runtime secrets)
          MONGODB_URI: mongodb://localhost:27017/test
          CLERK_SECRET_KEY: sk_test_placeholder

