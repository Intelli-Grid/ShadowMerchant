name: Annual Subscription Renewal Reminder

# Runs daily at 06:00 UTC (11:30 IST).
# Calls /api/internal/annual-renewal-reminder which sends reminder emails to
# annual Pro users expiring within 7 days. Idempotent: users already reminded
# are skipped via the annual_reminder_sent_at guard in MongoDB.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily = 11:30 IST
  workflow_dispatch:       # Allow manual trigger for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger annual renewal reminder endpoint
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/internal/annual-renewal-reminder" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $RESPONSE"
          echo "Response body:"
          cat response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "ERROR: Reminder endpoint returned HTTP $RESPONSE"
            exit 1
          fi

          ERRORS=$(cat response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('errors',0))")
          NOTIFIED=$(cat response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('notified',0))")
          echo "Notified: $NOTIFIED  Errors: $ERRORS"

          if [ "$ERRORS" -gt "0" ]; then
            echo "WARNING: $ERRORS reminder email(s) failed to send. Check Brevo API key and logs."
            # Non-fatal: next daily run will retry failed users.
          fi
